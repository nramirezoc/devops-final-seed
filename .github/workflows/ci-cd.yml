name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  ci-cd:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pytest flake8 pip-audit

      - name: Ejecutar tests
        run: pytest -v

      - name: Ejecutar linting
        continue-on-error: true
        run: flake8 src

      - name: Auditoría de seguridad
        continue-on-error: true
        run: pip-audit

      - name: Construir imagen Docker
        run: docker build -t todo-api:${{ github.run_number }} .


      - name: Tag image
        run: |
          docker tag todo-api:${{ github.run_number }} \
          ec2-3-80-242-135.compute-1.amazonaws.com:8082/docker-hosted/todo-api:${{ github.run_number }}    

      - name: Configure Docker insecure registry
        run: |
          echo '{
            "insecure-registries": ["ec2-3-80-242-135.compute-1.amazonaws.com:8082"]
          }' | sudo tee /etc/docker/daemon.json

          sudo systemctl restart docker    

      - name: Login Nexus
        run: |
          echo "${{ secrets.NEXUS_PASSWORD }}" | docker login ${{ secrets.NEXUS_URL }} -u ${{ secrets.NEXUS_USERNAME }} --password-stdin

      - name: Push Nexus
        run: |
          docker push \
          ${{ secrets.NEXUS_URL }}/docker-hosted/todo-api:${{ github.run_number }}
